<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let m of summary">
      <ion-label>
        <h2>{{ m.marketplace }}</h2>
        <p>Products: {{ m.count }}</p>
        <p>Profit: {{ m.profit | currency }}</p>
      </ion-label>
    </ion-item>
  </ion-list>


  <ion-button expand="block" routerLink="/add-product">Add Product</ion-button>
</ion-content>
