<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let p of products">
      <ion-label>
        <h2>{{ p.name }}</h2>
        <p>{{ p.description }}</p>
        <p>{{ p.price | currency }}</p>
      </ion-label>
      <ion-button fill="clear" (click)="editProduct(p)">Edit</ion-button>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-input placeholder="Name" [(ngModel)]="newProduct.name"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input placeholder="Description" [(ngModel)]="newProduct.description"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="number" placeholder="Price" [(ngModel)]="newProduct.price"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="saveProduct()">Save Product</ion-button>

</ion-content>
