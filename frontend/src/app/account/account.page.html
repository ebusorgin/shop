<ion-header>
  <ion-toolbar>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="floating">Display Name</ion-label>
      <ion-input [(ngModel)]="displayName"></ion-input>
    </ion-item>
    <ion-item lines="none">
      <ion-button expand="block" (click)="saveProfile()">Save Profile</ion-button>
    </ion-item>
    <ion-item button (click)="logout()">
      <ion-label color="danger">Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
