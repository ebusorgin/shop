<ion-header>
  <ion-toolbar>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label>
        <h2>{{ auth.getEmail() || 'Account' }}</h2>
        <p>Your account settings</p>
      </ion-label>
    </ion-item>
    <ion-item button (click)="logout()">
      <ion-label color="danger">Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
